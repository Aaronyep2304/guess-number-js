<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivina el Número</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="floating-numbers" aria-hidden="true">
    <span>7</span>
    <span>2</span>
    <span>9</span>
    <span>4</span>
    <span>1</span>
    <span>8</span>
    <span>3</span>
    <span>6</span>
    <span>0</span>
    <span>5</span>
  </div>

  <main class="game-card" id="game-card">
    <h1>🎯 La Cifra Oculta</h1>
    <p class="subtitle">Estoy pensando en un número del 1 al 100...</p>

    <form class="controls" id="gameForm">
      <label for="inputIntento" class="sr-only">Ingresa un número del 1 al 100</label>
      <input
        type="number"
        id="inputIntento"
        min="1"
        max="100"
        placeholder="?"
        inputmode="numeric"
        required
      >
      <button type="submit" id="btnAdivinar">Adivinar</button>
    </form>

    <p id="mensaje" aria-live="polite"></p>
    <p id="contador">Intentos: 0</p>
    <p id="historial">Historial:</p>
    <p id="puntaje">Puntaje: 100</p>
    <p id="record">Récord personal: 0</p>

    <button id="btnReiniciar" type="button" style="display: none;">
      🔥 Revancha
    </button>
  </main>

  <script src="script.js"></script>
</body>
</html>
